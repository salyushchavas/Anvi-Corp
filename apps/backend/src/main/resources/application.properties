spring.application.name=anvicorp-api

# ─────────────────────────────────────────────────────────────────────────────
# Logging + error path (careers exception module owns /error via ApiErrorController)
# ─────────────────────────────────────────────────────────────────────────────
# Include the per-request traceId (TraceIdFilter / MDC) in every log line so
# a user-reported failure (with X-Trace-Id in the response) is one grep away.
logging.pattern.level=%5p [%X{traceId:-}]

# Lock down the error path — Spring's Whitelabel + default error attributes
# (exception class, stack, raw message) must never reach the client.
server.error.whitelabel.enabled=false
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Bind to the platform-provided port (Railway/Heroku inject PORT); 8080 locally.
server.port=${PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# Datasource (PostgreSQL). Values from env; a fresh Postgres + ddl-auto=update
# creates the careers + mail_* tables on first boot.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
# Mail JWT filter reads domain.name/id while building the principal OUTSIDE any
# transaction, so open-in-view MUST stay false and MailAccount.domain EAGER.
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────────────────────────
# CORS — single allowed-origins list, consumed by BOTH the careers chain
# (SecurityConfig + global CorsFilter) AND the mail chain (MailSecurityConfig).
# ─────────────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:}

# ─────────────────────────────────────────────────────────────────────────────
# Application-level encryption key (AES-256-GCM). Used by BOTH the mail
# module (mail bodies + attachments) AND careers PII at-rest encryption
# (I-9, offer PII). base64 of exactly 32 raw bytes.
# Falls back to legacy I9_ENCRYPTION_KEY name for older deployments.
# Generate with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
pii.encryption.key=${PII_ENCRYPTION_KEY:${I9_ENCRYPTION_KEY:}}

# ═════════════════════════════════════════════════════════════════════════════
# CAREERS MODULE
# ═════════════════════════════════════════════════════════════════════════════

# ── Auth (careers JWT) ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
# Legacy hours field kept for back-compat. When ACCESS_TOKEN_TTL_MINUTES is at
# default (15), this hours value (if set explicitly) wins; otherwise minutes govern.
jwt.expiry-hours=${JWT_EXPIRY_HOURS:0}
app.auth.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
app.auth.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:14}

# ── Admin bootstrap (AdminSeeder) ───────────────────────────────────────────
admin.email=${ADMIN_EMAIL:admin@anvicorp.com}
admin.password=${ADMIN_PASSWORD:}

# ── Test / demo / backfill seeders (all gated OFF by default) ───────────────
# TestAccountSeeder — creates known-password test users. NEVER true in prod.
app.seed.test-accounts-enabled=${SEED_TEST_ACCOUNTS:false}
# One-off backfill for engagements stuck in PENDING_COMPLIANCE. Idempotent.
app.backfill.unstuck-onboarding-enabled=${BACKFILL_UNSTUCK_ONBOARDING:false}
# UserRoleReconciliationRunner — rebuilds role membership cache on boot.
# Cheap + idempotent; drives cycle-page role gates. Kill-switch: set false.
app.bootstrap.reconcile-user-roles-enabled=${RECONCILE_USER_ROLES:true}

# ── Judge0 (coding playground). Leaving key unset → sandbox reports "not
# configured" but boot succeeds.
app.judge0.api-key=${JUDGE0_RAPIDAPI_KEY:}
app.judge0.base-url=${JUDGE0_BASE_URL:https://judge0-ce.p.rapidapi.com}
app.judge0.host=${JUDGE0_HOST:judge0-ce.p.rapidapi.com}

# ── Resume storage (careers applications). Point at a Railway volume in prod.
app.resume.storage-path=${RESUME_STORAGE_PATH:./uploads/resumes}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Transactional email (SMTP out for careers notifications) ────────────────
# Unset SMTP_HOST/USERNAME → LogEmailProvider fallback (dev / CI).
# Set the full set on prod for real send. Gmail/Workspace/2FA → use APP PASSWORD.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:noreply@anvicorp.com}
app.mail.from-name=${MAIL_FROM_NAME:Anvi Corp}
# Public URL the email template references for the brand logo (email clients
# block inline attachments).
app.mail.logo-url=${MAIL_LOGO_URL:https://anvicorp.com/logo.png}
# Public URL the footer / brand link points at.
app.mail.brand-url=${MAIL_BRAND_URL:https://anvicorp.com}

# ── Brand identity (white-label) ────────────────────────────────────────────
# Used by careers notification bodies, activation invites, offer letters, etc.
# One value per key so a per-brand deploy can override without code changes.
# mail-from-name above is separate (SMTP From header personal name).
app.brand.name=${BRAND_NAME:Anvi Corp}
app.brand.product-name=${BRAND_PRODUCT_NAME:Anvi Careers}
app.brand.legal-name=${BRAND_LEGAL_NAME:Anvi Corp USA}
app.brand.support-email=${BRAND_SUPPORT_EMAIL:info@anvicorp.com}

# ── Password reset URL template (frontend deep link; {token} substituted) ──
app.password-reset.url-template=${PASSWORD_RESET_URL_TEMPLATE:http://localhost:3000/careers/reset-password?token={token}}

# ── Dashboard URLs (CTA links in careers notification emails) ───────────────
app.ops.notification-email=${OPS_NOTIFICATION_EMAIL:}
app.onboarding.dashboard-url=${ONBOARDING_DASHBOARD_URL:https://anvicorp.com/careers/intern}
app.offer.view-url-template=${OFFER_VIEW_URL_TEMPLATE:https://anvicorp.com/careers/intern/offers/{id}}
app.hr.dashboard-url=${HR_DASHBOARD_URL:https://anvicorp.com/careers/hr}
app.supervisor.dashboard-url=${SUPERVISOR_DASHBOARD_URL:https://anvicorp.com/careers/trainer}

# ── GitHub App (workspace / PR-based submissions). Blank → GitHubService
# unconfigured, boot continues. Private key: PEM-encoded, \n-escaped OK.
app.github.app-id=${GITHUB_APP_ID:}
app.github.installation-id=${GITHUB_INSTALLATION_ID:}
app.github.org-name=${ORG_NAME:}
app.github.private-key=${GITHUB_PRIVATE_KEY:}

# ── AWS S3 (careers documents + resumes). Soft-configured: any missing creds
# → S3 service is a no-op. Supports S3-compatible providers (R2/MinIO/B2)
# via endpoint-override + path-style. Brand-prefix namespaces objects when
# multiple brands share a bucket.
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.s3.endpoint-override=${AWS_S3_ENDPOINT_OVERRIDE:}
app.s3.path-style=${AWS_S3_PATH_STYLE:false}
app.s3.brand-prefix=${AWS_S3_BRAND_PREFIX:}
app.s3.enabled=${AWS_S3_ENABLED:true}

# ── Zoom (meetings). Server-to-Server OAuth. Enabled when creds present.
zoom.account-id=${ZOOM_ACCOUNT_ID:}
zoom.client-id=${ZOOM_CLIENT_ID:}
zoom.client-secret=${ZOOM_CLIENT_SECRET:}
zoom.enabled=${ZOOM_ENABLED:true}

# ── Frontend origin (embedded-signing returnUrl, callback links) ────────────
app.frontend.base-url=${FRONTEND_BASE_URL:https://anvicorp.com}

# ── Careers document vault (local disk; migrate to S3 for prod scale) ───────
app.documents.storage-path=${DOCUMENTS_STORAGE_PATH:./uploads/documents}

# ── Auto-linked default staff (Phase 8.6.4). Blank → ERM does it manually.
app.default-trainer-email=${DEFAULT_TRAINER_EMAIL:}
app.default-evaluator-email=${DEFAULT_EVALUATOR_EMAIL:}

# ═════════════════════════════════════════════════════════════════════════════
# WEB-MAIL MODULE (com.anvicorp.api.mail — internal Anvi mail app, /api/mail/**)
# Deliberately app.webmail.* + MAIL_JWT_SECRET / MAIL_ADMIN_* to avoid collision
# with careers' app.mail.* (SMTP) and the web app's Resend contact form.
# ═════════════════════════════════════════════════════════════════════════════

# Mail JWT — SEPARATE secret from careers JWT_SECRET. Fail CLOSED: unset/short
# → app still BOOTS but mail auth issues/accepts NO tokens (login 503, protected
# endpoints 401). Never a fallback key.
app.webmail.jwt.secret=${MAIL_JWT_SECRET:}
app.webmail.auth.access-token-ttl-minutes=${MAIL_ACCESS_TOKEN_TTL_MINUTES:15}
app.webmail.auth.refresh-token-ttl-days=${MAIL_REFRESH_TOKEN_TTL_DAYS:14}

# MailAdminSeeder (@Order 7). Idempotent + gated. Seeds anvicorp.com domain +
# one SUPER_ADMIN account (BCrypt, must_change_password=true) when enabled.
app.webmail.seed.admin-enabled=${SEED_MAIL_ADMIN:false}
app.webmail.seed.admin-email=${MAIL_ADMIN_EMAIL:}
app.webmail.seed.admin-password=${MAIL_ADMIN_PASSWORD:}
app.webmail.seed.admin-domain=${MAIL_ADMIN_DOMAIN:anvicorp.com}

# Admin provisioning — length of server-generated one-time passwords (>=12).
app.webmail.provisioning.generated-password-length=${MAIL_GENERATED_PASSWORD_LENGTH:16}

# Mail core (A2) — message/folder/search limits.
app.webmail.messages.default-page-size=${MAIL_DEFAULT_PAGE_SIZE:25}
app.webmail.messages.max-page-size=${MAIL_MAX_PAGE_SIZE:100}
app.webmail.messages.max-subject-length=${MAIL_MAX_SUBJECT_LENGTH:500}
app.webmail.messages.max-body-length=${MAIL_MAX_BODY_LENGTH:100000}
app.webmail.messages.max-recipients=${MAIL_MAX_RECIPIENTS:100}
# Bounded candidate scan for subject/participant search (body search deferred).
app.webmail.messages.search-scan-cap=${MAIL_SEARCH_SCAN_CAP:500}

# Attachments (A5) — 25 MiB cap on plaintext file size.
app.webmail.attachment-max-bytes=${MAIL_ATTACHMENT_MAX_BYTES:26214400}

# S3 attachment blob store (A5). Attachments are AES-encrypted before upload;
# objects live under a distinct Anvi key prefix. Endpoint-override + path-style
# support S3-compatible providers.
app.webmail.storage.s3.bucket=${AWS_S3_BUCKET:}
app.webmail.storage.s3.region=${AWS_S3_REGION:}
app.webmail.storage.s3.access-key-id=${AWS_S3_ACCESS_KEY_ID:}
app.webmail.storage.s3.secret-access-key=${AWS_S3_SECRET_ACCESS_KEY:}
app.webmail.storage.s3.key-prefix=${ANVI_MAIL_S3_PREFIX:anvi-mail/}
app.webmail.storage.s3.endpoint-override=${AWS_S3_ENDPOINT_OVERRIDE:}
app.webmail.storage.s3.path-style=${AWS_S3_PATH_STYLE:false}
app.webmail.storage.s3.enabled=${AWS_S3_ENABLED:true}
