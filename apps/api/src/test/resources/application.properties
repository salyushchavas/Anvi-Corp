# ── Phase A1 test profile ────────────────────────────────────────────────────
# In-memory H2 stands in for PostgreSQL so the boot/auth lifecycle can be
# verified without an external DB. ddl-auto creates the mail_* tables here just
# as it would on a fresh Postgres in production.
spring.datasource.url=jdbc:h2:mem:anvimail;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

cors.allowed-origins=http://localhost:3000

# Valid AES-256 key (base64 of 32 bytes) so AesGcmCipher initializes at boot.
pii.encryption.key=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=

# Valid (>= 32 byte) mail JWT secret for the configured-path tests.
app.webmail.jwt.secret=test-mail-jwt-secret-which-is-well-over-32-bytes-long-0123456789
app.webmail.auth.access-token-ttl-minutes=15
app.webmail.auth.refresh-token-ttl-days=14

# Seeder ON — the integration test asserts the seeded super-admin + idempotency.
app.webmail.seed.admin-enabled=true
app.webmail.seed.admin-email=admin@anvicorp.com
app.webmail.seed.admin-password=ChangeMe-Seed-123
app.webmail.seed.admin-domain=anvicorp.com
